apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catch-all
  namespace: ingress-nginx  # same namespace where your ingress controller is running
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ingress-nginx-defaultbackend  # must exist
            port:
              number: 80
