# helm_values/traefik/values.yaml
deployment:
  enabled: true

  ports:
    - name: web
      port: 80
      targetPort: 8000
    - name: websecure
      port: 443
      targetPort: 8443

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

ingressRoute:
  dashboard:
    enabled: false  # Disable useless default routes

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

log:
  level: WARN  # Keep logs lean for production

accessLog:
  enabled: false  # Enable only for debugging

api:
  dashboard: false  # Don't expose this garbage in production

# ACME TLS via Let's Encrypt
certificatesResolvers:
  letsencrypt:
    acme:
      email: your@email.com     # Use a real email
      storage: /data/acme.json  # Will persist certs
      httpChallenge:
        entryPoint: web

# Don’t persist anything
persistence:
  enabled: false
#  size: 128Mi

# Mount a volume to persist acme.json
# persistentVolumeClaim:
#   enabled: true
#   accessMode: ReadWriteOnce
#   size: 1Gi
#   storageClassName: standard  # or whatever your cluster supports
#   existingClaim: ""           # leave blank unless reusing

service:
  type: LoadBalancer
  ports:
    web:
      port: 80
      targetPort: 8000
    websecure:
      port: 443
      targetPort: 8443

rbac:
  enabled: true

serviceAccount:
  name: "" 

additionalArguments:
  - "--providers.kubernetescrd"

crds:
  enabled: true