name: Configure Infra
on:
  workflow_dispatch:
jobs:
  deploy:
    name: 'Configure Infrastructure'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      
    env:
      # GitHub auth with Terraform cloud used in "provider.tf" # Address is app.terraform.io becomes app_terraform.io. (must be prefixed with "TF_TOKEN_")
      # If set to local execution in terraform portal, only syncs states rather than also execute
      ##########################################################################
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
      ##########################################################################

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# Authenticates with Azure when Terraform portal is set to local, when set to Remote TF_TOKEN authenticates with Azure instead with client-id, tenant and subscription
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform apply
        run: terraform apply -auto-approve -var="location=eastus" -var="environment=dev1"

      - name: Make Script Executable
        run: chmod +x scripts/deploy-apps.sh

      # - name: Run Config Script
      #   run: ./scripts/config.sh